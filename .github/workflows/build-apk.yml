name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          mkdir -p www
          cp index.html icon-512.png www/
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.chorro.app",
            "appName": "chorro",
            "webDir": "www",
            "android": { "adjustMarginsForEdgeToEdge": "auto" }
          }
          EOF
          npx cap add android

      - name: Icon
        run: |
          pip install --break-system-packages pillow || sudo apt-get install -y python3-pil
          python3 - <<'EOF'
          from PIL import Image
          import os
          res = "android/app/src/main/res"
          src = Image.open("icon-512.png").convert("RGBA")
          sky = "#%02x%02x%02x" % src.convert("RGB").getpixel((5, 5))
          for d, k in {"mdpi": 1, "hdpi": 1.5, "xhdpi": 2, "xxhdpi": 3, "xxxhdpi": 4}.items():
              folder = f"{res}/mipmap-{d}"
              os.makedirs(folder, exist_ok=True)
              n = round(48 * k)
              for name in ("ic_launcher.png", "ic_launcher_round.png"):
                  src.resize((n, n), Image.LANCZOS).save(f"{folder}/{name}")
              fg = round(108 * k)
              inner = round(fg * 72 / 108)
              canvas = Image.new("RGBA", (fg, fg), (0, 0, 0, 0))
              canvas.paste(src.resize((inner, inner), Image.LANCZOS), ((fg - inner) // 2, (fg - inner) // 2))
              canvas.save(f"{folder}/ic_launcher_foreground.png")
          os.makedirs(f"{res}/mipmap-anydpi-v26", exist_ok=True)
          xml = '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/ic_launcher_background"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n'
          for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
              open(f"{res}/mipmap-anydpi-v26/{name}", "w").write(xml)
          os.makedirs(f"{res}/values", exist_ok=True)
          open(f"{res}/values/ic_launcher_background.xml", "w").write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">' + sky + '</color>\n</resources>\n')
          print("icons ok, background", sky)
          EOF

      - name: Build APK
        run: |
          sed -i 's/targetSdkVersion = 35/targetSdkVersion = 34/' android/variables.gradle || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: chorro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk chorro.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest chorro.apk --title "chorro (APK)" --notes "Установочный файл chorro.apk"
