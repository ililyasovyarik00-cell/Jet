name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          mkdir -p www
          cp index.html icon-512.png www/
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.chorro.app",
            "appName": "chorro",
            "webDir": "www",
            "android": { "adjustMarginsForEdgeToEdge": "auto" }
          }
          EOF
          npx cap add android

      - name: Developer page
        run: |
          python3 - <<'EOF'
          snippet = """
          <button id="dev-btn" aria-label="О разработчике" style="position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:99998;width:36px;height:36px;border-radius:50%;border:none;background:#0284c7;color:#fff;font:bold 18px sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.3)">i</button>
          <div id="dev-page" style="display:none;position:fixed;inset:0;z-index:99999;background:#fff;color:#111;font-family:sans-serif;padding:calc(32px + env(safe-area-inset-top,0px)) 24px 24px;overflow:auto">
          <h2 style="margin:0 0 16px">О разработчике</h2>
          <p style="font-size:18px;line-height:1.5">Приложение «chorro» создал <b>Ильясов Ярослав</b>, обучающийся группы <b>1РУПО2</b>.</p>
          <button id="dev-close" style="margin-top:24px;padding:12px 24px;border:none;border-radius:8px;background:#0284c7;color:#fff;font-size:16px">Закрыть</button>
          </div>
          <script>
          document.getElementById("dev-btn").onclick = function () { document.getElementById("dev-page").style.display = "block"; };
          document.getElementById("dev-close").onclick = function () { document.getElementById("dev-page").style.display = "none"; };
          </script>
          """
          p = "www/index.html"
          html = open(p, encoding="utf-8").read()
          i = html.rfind("</body>")
          html = html + snippet if i == -1 else html[:i] + snippet + html[i:]
          open(p, "w", encoding="utf-8").write(html)
          EOF
    
      - name: Icon
        run: |
          pip install --break-system-packages pillow || sudo apt-get install -y python3-pil
          python3 - <<'EOF'
          from PIL import Image
          import os
          res = "android/app/src/main/res"
          src = Image.open("icon-512.png").convert("RGBA")
          sky = "#%02x%02x%02x" % src.convert("RGB").getpixel((5, 5))
          for d, k in {"mdpi": 1, "hdpi": 1.5, "xhdpi": 2, "xxhdpi": 3, "xxxhdpi": 4}.items():
              folder = f"{res}/mipmap-{d}"
              os.makedirs(folder, exist_ok=True)
              n = round(48 * k)
              for name in ("ic_launcher.png", "ic_launcher_round.png"):
                  src.resize((n, n), Image.LANCZOS).save(f"{folder}/{name}")
              fg = round(108 * k)
              inner = round(fg * 72 / 108)
              canvas = Image.new("RGBA", (fg, fg), (0, 0, 0, 0))
              canvas.paste(src.resize((inner, inner), Image.LANCZOS), ((fg - inner) // 2, (fg - inner) // 2))
              canvas.save(f"{folder}/ic_launcher_foreground.png")
          os.makedirs(f"{res}/mipmap-anydpi-v26", exist_ok=True)
          xml = '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/ic_launcher_background"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n'
          for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
              open(f"{res}/mipmap-anydpi-v26/{name}", "w").write(xml)
          os.makedirs(f"{res}/values", exist_ok=True)
          open(f"{res}/values/ic_launcher_background.xml", "w").write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">' + sky + '</color>\n</resources>\n')
          print("icons ok, background", sky)
          EOF

      - name: Build APK
        run: |
          sed -i 's/targetSdkVersion = 35/targetSdkVersion = 34/' android/variables.gradle || true
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: chorro-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk chorro.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest chorro.apk --title "chorro (APK)" --notes "Установочный файл chorro.apk"
