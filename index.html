<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Дальность струи</title>
<style>
:root{--bg:#fff;--fg:#14171a;--muted:#667;--line:#d9dde3;--card:#f4f6f8;--acc:#2563eb}
@media (prefers-color-scheme:dark){:root{--bg:#14171a;--fg:#eceff3;--muted:#9aa4b2;--line:#2c323a;--card:#1d2227;--acc:#60a5fa}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:0 14px 24px}
.top{position:sticky;top:0;z-index:2;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0 0 6px}
canvas{width:100%;height:230px;display:block}
.res{font-size:14px;margin-top:6px}.res b{color:var(--acc)}
.leg{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;color:var(--muted)}
.leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
.s{background:var(--card);border-radius:12px;padding:10px 12px;margin-top:10px}
.s div{display:flex;justify-content:space-between;font-size:14px}
.s span{color:var(--acc);font-weight:600}
input[type=range]{width:100%;margin:8px 0 2px;accent-color:var(--acc)}
.note{font-size:12px;color:var(--muted);margin-top:12px}
</style>
</head>
<body>
<main>
<div class="top">
<h1>💧 Дальность струи от угла</h1>
<canvas id="c"></canvas>
<div class="leg"><span><i style="background:#3b82f6"></i>без сопротивления</span><span><i style="background:#f59e0b"></i>с сопротивлением</span></div>
<div class="res" id="res"></div>
</div>
<div id="sl"></div>
<p class="note">Скорость струи по Торричелли: v₀ = φ·√(2gH). Высоту воды H считайте до отверстия, h — высота отверстия над столом.</p>
</main>

<script>
const G = 9.81, $ = id => document.getElementById(id);
const P = [
  { id: 'a', name: 'Угол к горизонту', min: 0, max: 90, step: 1, val: 30, u: '°' },
  { id: 'H', name: 'Высота воды над отверстием H', min: 0, max: 50, step: 0.5, val: 15, u: 'см' },
  { id: 'h', name: 'Высота отверстия над столом h', min: 0, max: 50, step: 0.5, val: 30, u: 'см' },
  { id: 'phi', name: 'Коэффициент скорости φ', min: 0.9, max: 1, step: 0.01, val: 0.97, u: '' },
  { id: 'k', name: 'Сопротивление k', min: 0, max: 0.05, step: 0.001, val: 0.02, u: '1/м' }
];
$('sl').innerHTML = P.map(p => `<div class="s"><div>${p.name}<span id="v${p.id}"></span></div>
<input type="range" id="${p.id}" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.val}"></div>`).join('');
const val = id => parseFloat($(id).value);

function rangeIdeal(v0, a, h) {
  const vy = v0 * Math.sin(a), vx = v0 * Math.cos(a);
  return vx * (vy + Math.sqrt(vy * vy + 2 * G * h)) / G;
}
function simRange(v0, a, h, k, dt = 0.002) {
  let s = [0, h, v0 * Math.cos(a), v0 * Math.sin(a)];
  const f = s => { const v = Math.hypot(s[2], s[3]); return [s[2], s[3], -k * v * s[2], -G - k * v * s[3]]; };
  const ad = (s, d, m) => s.map((x, i) => x + m * d[i]);
  for (let n = 0; n < 100000; n++) {
    const k1 = f(s), k2 = f(ad(s, k1, dt / 2)), k3 = f(ad(s, k2, dt / 2)), k4 = f(ad(s, k3, dt));
    const ns = s.map((x, i) => x + dt / 6 * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]));
    if (ns[1] < 0) return s[0] + s[1] / (s[1] - ns[1]) * (ns[0] - s[0]);
    s = ns;
  }
  return s[0];
}

function plot(series, mark) {
  const cv = $('c'), dpr = window.devicePixelRatio || 1, w = cv.clientWidth, hh = cv.clientHeight;
  cv.width = w * dpr; cv.height = hh * dpr;
  const c = cv.getContext('2d'); c.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  const muted = cs.getPropertyValue('--muted').trim(), line = cs.getPropertyValue('--line').trim();
  const L = 40, R = 8, T = 8, B = 28;
  let ymax = 0; series.forEach(s => s.y.forEach(v => ymax = Math.max(ymax, v)));
  ymax = (ymax * 1.1) || 1;
  const X = v => L + v / 90 * (w - L - R), Y = v => hh - B - v / ymax * (hh - T - B);
  c.font = '11px system-ui'; c.lineWidth = 1;
  const st = Math.pow(10, Math.floor(Math.log10(ymax / 4))), m = [1, 2, 5, 10].find(m => ymax / (m * st) <= 5) * st;
  for (let v = 0; v <= ymax; v += m) {
    c.strokeStyle = line; c.beginPath(); c.moveTo(L, Y(v)); c.lineTo(w - R, Y(v)); c.stroke();
    c.fillStyle = muted; c.textAlign = 'right'; c.fillText(+v.toFixed(3), L - 4, Y(v) + 4);
  }
  for (let a = 0; a <= 90; a += 15) { c.fillStyle = muted; c.textAlign = 'center'; c.fillText(a + '°', X(a), hh - B + 14); }
  c.save(); c.translate(10, T + (hh - T - B) / 2); c.rotate(-Math.PI / 2); c.textAlign = 'center'; c.fillStyle = muted; c.fillText('Дальность, м', 0, 0); c.restore();
  series.forEach(s => {
    c.strokeStyle = s.color; c.lineWidth = 2; c.setLineDash(s.dash ? [6, 4] : []); c.beginPath();
    s.x.forEach((v, i) => i ? c.lineTo(X(v), Y(s.y[i])) : c.moveTo(X(v), Y(s.y[i])));
    c.stroke(); c.setLineDash([]);
  });
  c.strokeStyle = muted; c.lineWidth = 1; c.setLineDash([3, 3]); c.beginPath(); c.moveTo(X(mark.a), T); c.lineTo(X(mark.a), hh - B); c.stroke(); c.setLineDash([]);
  [[mark.li, '#3b82f6'], [mark.ld, '#f59e0b']].forEach(([v, col]) => { c.fillStyle = col; c.beginPath(); c.arc(X(mark.a), Y(v), 5, 0, 7); c.fill(); });
}

function update() {
  const a = val('a'), H = val('H') / 100, h = val('h') / 100, phi = val('phi'), k = val('k');
  P.forEach(p => $('v' + p.id).textContent = ' ' + val(p.id) + ' ' + p.u);
  const v0 = phi * Math.sqrt(2 * G * H), ang = [], li = [], ld = [];
  for (let d = 1; d <= 89; d++) { ang.push(d); li.push(rangeIdeal(v0, d * Math.PI / 180, h)); ld.push(simRange(v0, d * Math.PI / 180, h, k)); }
  const ar = a * Math.PI / 180, mi = rangeIdeal(v0, ar, h), md = simRange(v0, ar, h, k);
  const oi = li.indexOf(Math.max(...li)), od = ld.indexOf(Math.max(...ld));
  $('res').innerHTML = `v₀ = <b>${v0.toFixed(2)} м/с</b>. При ${a}°: <b>${(mi * 100).toFixed(1)} см</b> (без сопр.), <b>${(md * 100).toFixed(1)} см</b> (с сопр.)<br>Лучший угол: ${ang[oi]}° (без сопр.), ${ang[od]}° (с сопр.)`;
  plot([{ x: ang, y: li, color: '#3b82f6' }, { x: ang, y: ld, color: '#f59e0b', dash: true }], { a, li: mi, ld: md });
}

P.forEach(p => $(p.id).addEventListener('input', update));
window.addEventListener('resize', update);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', update);
update();
try { if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js'); } catch (e) {}
</script>
</body>
</html>
